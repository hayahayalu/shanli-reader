<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>取色</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    background: #f7f5f0;
    color: #24211c;
    font-size: 13px;
    overflow: hidden;
    user-select: none;
  }
  .wrap { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
  .sv {
    position: relative; width: 100%; height: 180px; border-radius: 8px;
    overflow: hidden; cursor: crosshair; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .sv-white, .sv-black { position: absolute; inset: 0; }
  .sv-white { background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sv-black { background: linear-gradient(to top, #000, rgba(0,0,0,0)); }
  .knob {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .row { display: flex; gap: 12px; align-items: center; }
  .hue { flex: 1; position: relative; height: 16px; border-radius: 8px; cursor: pointer;
    background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .hue-knob {
    position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 2px solid #fff; transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.28); pointer-events: none;
  }
  .preview { width: 34px; height: 34px; border-radius: 8px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.16); }
  .fields { display: flex; gap: 8px; }
  .field { flex: 1; }
  .field label { display: block; font-size: 10.5px; opacity: .55; margin-bottom: 3px; letter-spacing: .05em; }
  input[type=text] {
    width: 100%; height: 30px; border: 1px solid #ddd7cc; border-radius: 7px;
    padding: 0 8px; font: inherit; font-size: 12.5px; background: #fff; outline: none;
    font-variant-numeric: tabular-nums;
  }
  input[type=text]:focus { border-color: #a89a80; }
  .swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .sw { aspect-ratio: 1; border-radius: 5px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.13); }
  .sw:hover { transform: scale(1.12); }
  .alpha-row { display: flex; align-items: center; gap: 10px; }
  .alpha-row input[type=range] { flex: 1; accent-color: #2f2a22; }
  .alpha-val { width: 46px; text-align: right; font-variant-numeric: tabular-nums; opacity: .7; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; padding-top: 4px; }
  button {
    height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid #ddd7cc;
    background: #fff; font: inherit; font-size: 12.5px; cursor: pointer; color: #3a352c;
  }
  button:hover { background: #f0ece4; }
  button.primary { background: #2f2a22; border-color: #2f2a22; color: #f7f4ee; }
  button.primary:hover { background: #423a2e; }
  .strip { height: 10px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
</style>
</head>
<body>
<div class="wrap">
  <div class="sv" id="sv">
    <div class="sv-white"></div>
    <div class="sv-black"></div>
    <div class="knob" id="knob"></div>
  </div>

  <div class="row">
    <div class="hue" id="hue"><div class="hue-knob" id="hueKnob"></div></div>
    <div class="preview" id="preview"></div>
  </div>

  <div class="fields">
    <div class="field">
      <label>HEX</label>
      <input type="text" id="hex" spellcheck="false" />
    </div>
    <div class="field">
      <label>R</label>
      <input type="text" id="r" spellcheck="false" />
    </div>
    <div class="field">
      <label>G</label>
      <input type="text" id="g" spellcheck="false" />
    </div>
    <div class="field">
      <label>B</label>
      <input type="text" id="b" spellcheck="false" />
    </div>
  </div>

  <div class="swatches" id="swatches"></div>

  <div class="alpha-row">
    <span style="opacity:.6;font-size:11.5px">透明度</span>
    <input type="range" id="alpha" min="0" max="100" value="100" />
    <span class="alpha-val" id="alphaVal">100%</span>
  </div>

  <div class="strip" id="strip"></div>

  <div class="actions">
    <button id="cancel">取消</button>
    <button id="ok" class="primary">应用</button>
  </div>
</div>

<script src="color-picker.js"></script>
</body>
</html>
